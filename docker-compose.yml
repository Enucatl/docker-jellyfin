services:
  jellyfin:
    extends:
      file: ../compose-security-baseline/hardening.yml
      service: hardened-xlarge
    image: jellyfin/jellyfin:latest
    user: "1000:1000"
    cpus: 4
    volumes:
      - config:/config
      - cache:/cache
      - /scratch/qbittorrent:/media:ro
    tmpfs:
      - /tmp:size=256m,uid=1000,gid=1000
    ports:
      - "10.0.0.158:8096:8096"
    environment:
      JELLYFIN_PublishedServerUrl: https://jellyfin.enucatl.com
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8096/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

  cloudflared:
    extends:
      file: ../compose-security-baseline/hardening.yml
      service: hardened-small
    image: cloudflare/cloudflared:latest
    profiles: [public]
    environment:
      TUNNEL_TOKEN_FILE: /run/secrets/tunnel_token
      TUNNEL_METRICS: 127.0.0.1:20241
    secrets:
      - tunnel_token
    command: tunnel --no-autoupdate run
    healthcheck:
      test: ["CMD", "cloudflared", "tunnel", "--metrics", "127.0.0.1:20241", "ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  config:
  cache:

secrets:
  tunnel_token:
    file: ./secrets/tunnel_token
