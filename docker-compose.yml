services:
  jellyfin:
    extends:
      file: ../compose-security-baseline/hardening.yml
      service: hardened-xlarge
    image: jellyfin/jellyfin:latest
    user: "1000:1000"
    cpus: 4
    volumes:
      - config:/config
      - cache:/cache
      - /scratch/qbittorrent:/media:ro
      - /etc/ssl/certs/ca-certificates.crt:/etc/ssl/certs/ca-certificates.crt:ro
    tmpfs:
      - /tmp:size=256m,uid=1000,gid=1000
    networks:
      - jellyfin_traefik
    environment:
      JELLYFIN_PublishedServerUrl: https://jellyfin.atlas.home.arpa
    labels:
      - 'traefik.enable=true'
      - 'traefik.docker.network=jellyfin_traefik'
      - 'traefik.http.routers.jellyfin.rule=Host(`jellyfin.atlas.home.arpa`)'
      - 'traefik.http.routers.jellyfin.entrypoints=https'
      - 'traefik.http.routers.jellyfin.tls=true'
      - 'traefik.http.routers.jellyfin.middlewares=secured@file'
      - 'traefik.http.services.jellyfin.loadbalancer.server.port=8096'
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8096/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

volumes:
  config:
  cache:

networks:
  jellyfin_traefik:
    name: jellyfin_traefik
    enable_ipv6: true
